# Beacon Configuration

# Amateur radio callsign (required for legal identification)
callsign: "K7LED"  # M&K Club Call

# Beacon timing
beacon_interval_seconds: 60  # Time between beacon transmissions
identification_interval_seconds: 600  # CW ID every 10 minutes (FCC requirement)

# AIOC (All-In-One Cable) PTT configuration
# The AIOC provides hardware PTT via serial port DTR line.
# Run: ls /dev/ttyACM* or ls /dev/serial/by-id/ to find the AIOC port.
# Set ptt_enabled: false to use VOX mode instead (e.g. if AIOC is unavailable).
ptt:
  enabled: true
  port: "/dev/ttyACM0"  # AIOC serial port (adjust if multiple USB-serial devices)
  ptt_on_delay: 0.05    # Seconds to wait after asserting PTT before sending audio
  ptt_off_delay: 0.05   # Seconds to wait after audio ends before releasing PTT

# Audio device configuration
audio:
  # Device index (run test_audio.py to list available devices)
  # Use null to auto-select default output device
  # AIOC typically shows as "USB Audio Device" or "AIOC" in the device list
  device_index: null
  
  # Sample rate (Hz)
  sample_rate: 48000
  
  # Audio amplitude (0.0 to 1.0)
  # With hardware PTT this only affects audio deviation, not VOX triggering
  amplitude: 0.7
  
  # Pre-transmission silence (seconds)
  # Brief silence after PTT asserted before audio starts
  pre_audio_silence: 0.0
  
  # Post-transmission silence (seconds)
  # Silence after audio before PTT release
  post_audio_silence: 0.1

# Morse code settings
morse:
  # Speed in words per minute
  wpm: 20
  
  # Tone frequency (Hz)
  frequency: 700
  
  # Farnsworth timing (use slower character spacing for readability)
  # Set to same as wpm for standard timing
  farnsworth_wpm: 20

# Beacon message
message:
  # Message type: "tone", "morse", "voice" (voice not yet implemented)
  type: "morse"
  
  # For morse type: text to send
  text: "FOX DE {callsign}"
  
  # For tone type: frequency (Hz) and duration (seconds)
  tone_frequency: 1000
  tone_duration: 2.0

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "beacon.log"
  console: true
