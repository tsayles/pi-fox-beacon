# Beacon Configuration

callsign: "KE4HET"

# Beacon interval — synced to system clock.
# 15 = fires at :00, :15, :30, :45 each minute.
beacon_interval_seconds: 15

# AIOC PTT (ioctl TIOCMBIS/TIOCMBIC — pyserial dtr alone does not work)
ptt:
  enabled: true
  port: "/dev/serial/by-id/usb-AIOC_All-In-One-Cable_3380a5b0-if04"
  ptt_on_delay: 0.05
  ptt_off_delay: 0.05

# Audio — use aplay ALSA device, NOT sounddevice (causes USB timeouts)
audio:
  alsa_device: "plughw:AllInOneCable,0"
  sample_rate: 48000
  amplitude: 0.7
  pre_audio_silence: 0.0
  post_audio_silence: 0.1

# Multi-tone identification pattern (Byonics MF-15 compatible)
# Tone indices map to a chromatic scale: index 26 = 700 Hz.
# Index 0 = silence.
# speed_ms: duration per element in milliseconds.
# 64 elements × 75 ms = 4.8 s ≈ 5 s pattern.
tones:
  enabled: true
  speed_ms: 75
  sequence: "1,20,1,20,1,11,11,11,1,20,1,20,1,11,11,11,\
1,23,1,23,1,16,16,16,1,23,1,23,1,16,16,16,\
1,26,1,26,1,20,20,20,1,26,1,26,1,20,20,20,\
1,28,1,28,1,23,23,23,1,28,1,28,1,23,23,23"

# CW identification appended after tone pattern
morse:
  wpm: 20
  frequency: 700    # Hz (matches tone index 26)
  farnsworth_wpm: 20

# Message section
message:
  pause_before_cw: 0.3   # seconds between tone pattern and CW ID

# Logging
logging:
  level: "INFO"
  file: "beacon.log"
  console: true
