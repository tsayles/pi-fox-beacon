# Beacon Configuration

# Amateur radio callsign (required for legal identification)
callsign: "N0CALL"

# Beacon timing
beacon_interval_seconds: 60  # Time between beacon transmissions
identification_interval_seconds: 600  # CW ID every 10 minutes (FCC requirement)

# Audio device configuration
audio:
  # Device index (run test_audio.py to list available devices)
  # Use null to auto-select default output device
  # UGREEN USB adapter typically shows as "USB Audio Device" or similar
  device_index: null
  
  # Sample rate (Hz)
  # UGREEN adapter supports up to 96kHz, but 48kHz is sufficient for beacon
  sample_rate: 48000
  
  # VOX trigger level (0.0 to 1.0)
  # 0.5 = 50% of maximum amplitude
  # Adjust based on radio's VOX sensitivity
  # Start with 0.6 and Baofeng VOX level 5, then tune as needed
  # Too high = false triggers, too low = unreliable keying
  vox_trigger_level: 0.6
  
  # Pre-transmission silence (seconds)
  # Brief silence before audio to let VOX stabilize
  # Helps prevent cutting off the start of morse code
  pre_audio_silence: 0.2
  
  # Post-transmission silence (seconds)
  # Silence after audio before ending (VOX hold time)
  # Baofeng VOX delay adds additional hold time
  post_audio_silence: 0.5

# Morse code settings
morse:
  # Speed in words per minute
  wpm: 20
  
  # Tone frequency (Hz)
  frequency: 700
  
  # Farnsworth timing (use slower character spacing for readability)
  # Set to same as wpm for standard timing
  farnsworth_wpm: 20

# Beacon message
message:
  # Message type: "tone", "morse", "voice" (voice not yet implemented)
  type: "morse"
  
  # For morse type: text to send
  text: "FOX DE {callsign}"
  
  # For tone type: frequency (Hz) and duration (seconds)
  tone_frequency: 1000
  tone_duration: 2.0
  
# Power stepping simulation
# In MVP, we simulate power stepping by varying audio amplitude
# Lower amplitude = lower VOX trigger reliability = effectively lower power
power_steps:
  enabled: false
  
  # List of power levels (0.0 to 1.0, relative to vox_trigger_level)
  # Example: [1.0, 0.8, 0.6, 0.4] starts at full, steps down over time
  levels: [1.0, 0.8, 0.6, 0.4]
  
  # Duration for each step (seconds)
  step_duration_seconds: 300  # 5 minutes per step

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "beacon.log"
  console: true
